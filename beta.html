<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Signup - Student Maps</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .beta-section { padding: 140px 0 60px; min-height: 80vh; display: flex; align-items: center; }
        .beta-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px); 
            border-radius: 24px; 
            padding: 3rem; 
            border: 1px solid var(--glass-border);
            max-width: 500px; margin: 0 auto; width: 100%;
        }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input { width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container nav-container">
            <a href="test.html" class="nav-brand">
                <img src="logo-clear.png" alt="Student Maps" class="nav-logo">
                <span>Student Maps</span>
            </a>
            <div class="nav-center">
                <a href="test.html#home">Home</a>
                <a href="test.html#features">Features</a>
            </div>
            <div class="nav-right">
                <a href="beta.html" class="btn btn-primary btn-sm">Join Beta</a>
            </div>
        </div>
    </nav>

    <section class="beta-section">
        <div class="container">
            <div class="beta-card">
                <h1>Join the Beta</h1>
                <form action="https://formspree.io/f/mdallyeq" method="POST">
                    <div class="form-group">
                        <label>Naam</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Aanmelden</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="footer-copy">&copy; 2026 Student Maps</p>
            <div class="footer-links">
                <a href="privacy.html">Privacy</a>
                <a href="beta.html">Beta</a>
            </div>
        </div>
    </footer>
</body>
</html>
