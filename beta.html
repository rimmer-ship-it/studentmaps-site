<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta - Student Maps</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .beta-section { padding: 120px 0 60px; min-height: 80vh; display: flex; align-items: center; }
        .beta-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px); 
            border-radius: 24px; 
            padding: 3rem; 
            border: 1px solid var(--glass-border);
            max-width: 500px; margin: 0 auto;
        }
        input { width: 100%; padding: 0.8rem; margin: 0.5rem 0 1.5rem; border-radius: 12px; border: 1px solid var(--glass-border); }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container nav-container">
            <a href="/" class="nav-brand"><span>Student Maps</span></a>
            <div class="nav-center"><a href="/">Home</a></div>
        </div>
    </nav>

    <section class="beta-section">
        <div class="container">
            <div class="beta-card">
                <h1>Join the Beta</h1>
                <form action="https://formspree.io/f/mdallyeq" method="POST">
                    <label>Naam</label>
                    <input type="text" name="name" required>
                    <label>Email</label>
                    <input type="email" name="email" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Aanmelden</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="footer-copy">&copy; 2026 Student Maps</p>
            <div class="footer-links">
                <a href="/privacy">Privacy</a>
                <a href="/">Home</a>
            </div>
        </div>
    </footer>
</body>
</html>
