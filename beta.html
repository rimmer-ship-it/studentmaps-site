<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Signup - Student Maps</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .beta-section { padding: 140px 0 60px; min-height: 80vh; display: flex; align-items: center; }
        .beta-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px); 
            border-radius: 24px; 
            padding: 3rem; 
            border: 1px solid var(--glass-border);
            max-width: 450px; margin: 0 auto; width: 100%;
        }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input { width: 100%; padding: 0.8rem; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container nav-container">
            <a href="test.html" class="nav-brand">
                <img src="logo-clear.png" alt="Student Maps" class="nav-logo">
                <span>Student Maps</span>
            </a>
            <div class="nav-center">
                <a href="test.html#home">Home</a>
                <a href="test.html#features">Features</a>
            </div>
            <div class="nav-right">
                <a href="beta.html" class="btn btn-primary btn-sm">Join Beta</a>
            </div>
        </div>
    </nav>

    <section class="hero-header" id="beta">
        <h1 class="hero-title">
            Beta signup Student Maps
        </h1>
        <p class="hero-subtitle">
            Join the beta group to test early versions, give feedback, suggest ideas and to stay updated.
        </p>
    </section>

    <section class="beta-section">
        <div class="container">
            <div class="beta-card">
                <form id="betaForm" action="https://formspree.io/f/mdallyeq" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="full name" required>
                    </div>
    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>
    
                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            placeholder="+31 6 12345678" 
                            pattern="[+]?[0-9\s-]{7,15}" 
                            title="Provide a valid phone number"
                            required
                        >
                    </div>
    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
                    
                    <div id="ok" style="display:none; color: var(--primary); text-align: center; margin-top: 1.5rem; font-weight: 500;">
                        Thanks! We’ll reach out soon.
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="footer-copy">&copy; 2026 Student Maps</p>
            <div class="footer-links">
                <a href="privacy.html">Privacy</a>
                <a href="beta.html">Beta</a>
            </div>
        </div>
    </footer>
</body>
</html>
