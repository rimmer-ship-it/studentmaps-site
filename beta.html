<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=contain">
    <title>Beta Signup - Student Maps</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav">
        <div class="container nav-container">
            <a href="test.html" class="nav-brand">
                <img src="logo-clear.webp" alt="Student Maps" class="nav-logo">
                <span>Student Maps</span>
            </a>
            <div class="nav-center">
                <a href="test.html#home">Home</a>
                <a href="test.html#features">Features</a>
            </div>
            <div class="nav-right">
                    <div class="nav-social">
                        <a href="https://instagram.com/student_maps" target="_blank" rel="noopener">
                            <img src="instagram.webp" alt="Instagram" class="social-icon">
                        </a>
                        <a href="https://tiktok.com/@JOUWACCOUNT" target="_blank" rel="noopener">
                            <img src="tiktok.webp" alt="TikTok" class="social-icon">
                        </a>
                    </div>
                <a href="beta.html" class="btn btn-primary btn-sm">Early Acces</a>
            </div>
        </div>
    </nav>

    <section class="hero-header" id="beta">
        <h1 class="hero-title">
            Get Early Access
        </h1>
        <p class="hero-subtitle">
            Join the insider group to unlock early versions, drop your own ideas, and help us build the ultimate map for student life.
        </p>
    </section>
    
    <section class="page-section">
        <div class="container">
            <div class="page-card page-card-sm">
                <form id="betaForm" action="https://formspree.io/f/mdallyeq" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="full name" required>
                    </div>
    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>
    
                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            placeholder="+31 6 12345678" 
                            pattern="[+]?[0-9\s-]{7,15}" 
                            title="Provide a valid phone number"
                            required
                        >
                    </div>
    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Get Access</button>
                    
                    <div id="ok" style="display:none; color: var(--primary); text-align: center; margin-top: 1.5rem; font-weight: 500;">
                        Thanks! We’ll reach out soon.
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="footer-copy">&copy; 2026 Student Maps. All rights reserved.</p>
            <div class="footer-bottom">
                <div class="footer-links">
                    <a href="/privacy">Privacy</a>
                    <a href="mailto:hello@studentmaps.app">Contact</a>
                </div>
                <div class="footer-social">
                    <a href="https://instagram.com/student_maps" target="_blank" rel="noopener">
                        <img src="instagram.webp" alt="Instagram" class="social-icon">
                    </a>
                    <a href="https://tiktok.com/@JOUWACCOUNT" target="_blank" rel="noopener">
                        <img src="tiktok.webp" alt="TikTok" class="social-icon">
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
