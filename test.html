<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Maps - Discover the best spots</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="nav">
    <div class="container nav-container">
      <a href="#home" class="nav-brand">
        <img src="logo.png" alt="Student Maps" class="nav-logo">
        <span>Student Maps</span>
      </a>
      <div class="nav-links">
        <a href="#features">Features</a>
        <a href="#download" class="btn btn-primary btn-sm">Download</a>
      </div>
    </div>
  </nav>

  <section class="hero" id="home">
    <div class="container">

      <div class="hero-content">
        <div class="logo-container">
          <img src="logo.png" alt="Student Maps Logo" class="hero-logo">
        </div>
        <h1 class="hero-title">
          Discover the best spots<br>
          <span class="gradient-text">for students</span>
        </h1>
        <div class="cta-buttons">
          <a href="#download" class="btn btn-primary">Download App</a>
          <a href="#features" class="btn btn-secondary">Learn More &rarr;</a>
        </div>
      </div>

      <div class="hero-visual">
        <div class="feature-card card-1">
          <div class="card-header">
            <span class="card-icon">📍</span>
            <h3>My Spots</h3>
          </div>
          <div class="screenshot-list">
            <img src="spot1.png" class="screenshot-item" alt="Spot">
            <img src="spot2.png" class="screenshot-item" alt="Spot">
            <img src="spot3.png" class="screenshot-item" alt="Spot">
          </div>
          <div class="card-footer">
            <span>Suggest Spot</span>
            <button class="plus-btn">+</button>
          </div>
        </div>

        <div class="feature-card card-2">
          <div class="card-header">
            <span class="card-icon">⭐</span>
            <h3>My Reviews</h3>
          </div>
          <div class="screenshot-list">
            <img src="rev1.png" class="screenshot-item" alt="Review">
            <img src="rev2.png" class="screenshot-item" alt="Review">
          </div>
          <div class="card-footer">
            <span>Write Review</span>
            <button class="plus-btn">+</button>
          </div>
        </div>

        <div class="feature-card card-3">
          <div class="card-header">
            <span class="card-icon">🔍</span>
            <h3>Search Others</h3>
          </div>
          <div class="search-bar-ios">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Find students...</span>
          </div>
        </div>

        <div class="phone-container">
          <div class="phone-mockup">
            <div class="phone-notch"></div>
            <div class="phone-screen">
              <img src="screenshot1.png" alt="App Screen" class="phone-screenshot">
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
