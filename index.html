<!DOCTYPE html>
<html lang="nl">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-48RDYSEJPC"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-48RDYSEJPC');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="favicon.png">

  <meta name="description" content="Discover the best spots in your city. Built for students, by students.">
  <meta property="og:title" content="Student Maps">
  <meta property="og:description" content="Discover the best spots in your city. Built for students, by students.">
  <meta property="og:image" content="https://studentmaps.nl/favicon.png">
  <meta property="og:url" content="https://studentmaps.nl">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <title>Student Maps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #6e6e73;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .badge {
      display: inline-block;
    }
    .badge img {
      width: 156px;
      height: auto;
      border-radius: 0;
      margin: 0;
    }
    .soon {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 32px;
      background: #00b5ad;
      color: white;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/favicon.png" alt="Student Maps logo">
    <h1>Student Maps</h1>
    <p>Discover the best spots in your city.</p>

    <!-- Vervang de href als de app live is in de App Store -->
    <a class="soon" href="#">Not available yet</a>
  </div>

  <div id="cookie-banner" class="cookie-banner hidden">
    <div class="cookie-container">
        <p>We use cookies to understand how students use our map. This helps us build a better experience. Read more in our <a href="privacy.html" style="color: var(--primary); text-decoration: underline;">privacy statement</a>.</p>
        <div class="cookie-buttons">
            <button id="accept-cookies" class="btn btn-primary">Accept all</button>
            <button id="reject-cookies" class="btn btn-secondary">Necessary</button>
        </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
