<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="Student Maps">
  <meta property="og:description" content="Discover the best spots in your city">
  <meta property="og:image" content="https://studentmaps.nl/og-image.png">
  <meta property="og:url" content="https://studentmaps.nl">
  <meta property="og:type" content="website">

  <title>Student Maps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #6e6e73;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .badge {
      display: inline-block;
    }
    .badge img {
      width: 156px;
      height: auto;
      border-radius: 0;
      margin: 0;
    }
    .soon {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 32px;
      background: #00b5ad;
      color: white;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/og-image.png" alt="Student Maps logo">
    <h1>Student Maps</h1>
    <p>Discover the best spots in your city.</p>

    <!-- Vervang de href als de app live is in de App Store -->
    <a class="soon" href="#">Not yet available</a>
  </div>
</body>
</html>
