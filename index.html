<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <meta name="description" content="Discover the best spots in your city. Built for students, by students.">
  <meta property="og:title" content="Student Maps">

  <meta property="og:image" content="https://studentmaps.nl/favicon.png">

  <title>Student Maps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column; /* Zorgt ervoor dat de footer netjes onder de card valt */
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #6e6e73;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .soon {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 32px;
      background: #00b5ad;
      color: white;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
    
    /* Nieuwe styling voor de bedrijfsgegevens / footer */
    .company-footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #86868b;
      line-height: 1.8;
      max-width: 400px;
    }
    .company-footer strong {
      color: #1d1d1f;
      font-weight: 600;
    }
    .company-footer a {
      color: #86868b;
      text-decoration: none;
      border-bottom: 1px solid #d2d2d7;
      transition: all 0.2s ease;
    }
    .company-footer a:hover {
      color: #1d1d1f;
      border-bottom-color: #1d1d1f;
    }
  </style>
</head>
<body>
  
  <div class="card">
    <img src="/favicon.png" alt="Student Maps logo">
    <h1>Student Maps</h1>
    <p>Discover the best spots in your city. Built for students, by students.</p>
    <a class="soon" href="mailto:spots@studentmaps.nl">App in development</a>
  </div>

  <div class="company-footer">
    <strong>Student Maps</strong><br>
    Developing commercial mobile applications for students.<br><br>
    <strong>Company Details</strong><br>
    KvK number: 93719485<br>
    Middenweg 231 3, 1098AP Amsterdam, The Netherlands<br>
    Contact: <a href="mailto:spots@studentmaps.nl">spots@studentmaps.nl</a><br><br>
  </div>

  <script src="script.js"></script>
</body>
</html>
